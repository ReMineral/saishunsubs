name: Sakurazaka Auto Sync

on:
  schedule:
    - cron: '0 0 * * *' # Jalan otomatis setiap jam 00:00 UTC
  workflow_dispatch: # PENTING: Ini agar tombol di Web bisa men-trigger file ini

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan Scraper
        # Action ini akan menjalankan file update_member.js kamu
        run: node update_member.js

      - name: Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blogprofil.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Auto-sync: Update member profiles [skip ci]"
            git push
          fi
