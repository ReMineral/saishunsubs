<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakurazaka46 Member Manager</title>
    <style>
        :root { --sakura: #e1007e; --bg: #f9fafb; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; text-align: center; }
        
        h1 { color: var(--sakura); font-weight: 800; margin-bottom: 5px; }
        .last-update { font-size: 13px; color: #666; margin-bottom: 30px; }

        /* Grid Layout */
        .member-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; margin-bottom: 40px; 
        }

        /* Card Design */
        .card { 
            background: white; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .card-info { padding: 10px; }
        .name-jp { display: block; font-weight: bold; font-size: 14px; }
        .name-en { display: block; font-size: 12px; color: #888; }

        /* Floating Button Container */
        .footer-action {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 30px; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 20px;
        }

        .btn-update {
            background: var(--sakura); color: white; border: none; padding: 12px 25px;
            border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-update:hover { background: #b80067; }
        .btn-update:disabled { background: #ccc; cursor: not-allowed; }

        /* Loading Animation */
        .loader {
            width: 20px; height: 20px; border: 3px solid #f3f3f3;
            border-top: 3px solid var(--sakura); border-radius: 50%;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 Sakurazaka46 Profiles</h1>
    <div class="last-update" id="timestamp">Memuat data...</div>

    <div class="member-grid" id="member-grid">
        </div>
</div>

<div class="footer-action">
    <div class="loader" id="sync-loader"></div>
    <button class="btn-update" id="update-btn" onclick="triggerUpdate()">Update Member Data</button>
</div>

<script>
    const REPO = "re-saishun/saishunsubs"; // Ganti dengan repo kamu
    const JSON_PATH = "blogprofil.json";

    // 1. Ambil Data untuk Tampilan Preview
    async function loadPreview() {
        try {
            const res = await fetch(`${JSON_PATH}?t=${Date.now()}`);
            const data = await res.json();
            const grid = document.getElementById('member-grid');
            grid.innerHTML = "";

            Object.values(data).forEach(m => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${m.img}" loading="lazy">
                        <div class="card-info">
                            <span class="name-jp">${m.name_jp}</span>
                            <span class="name-en">${m.name_romaji}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('timestamp').innerText = "Preview dari blogprofil.json saat ini";
        } catch (e) {
            console.error("Gagal load data preview", e);
        }
    }

    // 2. Trigger GitHub Action (Tanpa Token di Code)
    async function triggerUpdate() {
        const btn = document.getElementById('update-btn');
        const loader = document.getElementById('sync-loader');

        // Untuk men-trigger GitHub Action dari Web secara langsung, 
        // kamu memerlukan Personal Access Token (PAT).
        // Karena kamu minta Token ditaruh di Secret, maka trigger-nya 
        // dilakukan lewat Workflow Dispatch.
        
        const token = prompt("Masukkan GitHub Token untuk konfirmasi:");
        if(!token) return;

        btn.disabled = true;
        loader.style.display = "block";
        btn.innerText = "Syncing with GitHub...";

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/update_member.yml/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({ ref: "main" })
            });

            if (res.ok) {
                alert("Update dimulai! Silakan tunggu 1-2 menit lalu refresh halaman ini.");
            } else {
                alert("Gagal memulai update. Cek Token atau Nama Workflow.");
            }
        } catch (e) {
            alert("Terjadi kesalahan koneksi.");
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
            btn.innerText = "Update Member Data";
        }
    }

    window.onload = loadPreview;
</script>

</body>
</html>
