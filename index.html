<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakurazaka46 Member Manager</title>
    <style>
        :root { --sakura: #e1007e; --bg: #f9fafb; --card-bg: #ffffff; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; padding-bottom: 100px; }
        
        header { margin-bottom: 40px; }
        h1 { color: var(--sakura); font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        
        /* Badge Status & Time */
        .status-container { display: inline-flex; align-items: center; gap: 8px; background: white; padding: 8px 16px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        .last-update { font-size: 13px; color: #666; font-weight: 500; }

        /* Grid Layout */
        .member-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; margin-top: 20px;
        }

        /* Card Design */
        .card { 
            background: var(--card-bg); border-radius: 16px; overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f0f0f0;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(225,0,126,0.1); border-color: var(--sakura); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #f3f4f6; transition: 0.3s; }
        .card:hover img { filter: brightness(1.05); }
        .card-info { padding: 12px; text-align: left; }
        .name-jp { display: block; font-weight: 700; font-size: 14px; color: #1f2937; margin-bottom: 2px; }
        .name-en { display: block; font-size: 12px; color: #9ca3af; font-weight: 500; }

        /* Floating Action Bar */
        .footer-action {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 12px 24px; border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px;
            border: 1px solid rgba(225,0,126,0.2); z-index: 1000;
        }

        .btn-update {
            background: var(--sakura); color: white; border: none; padding: 12px 28px;
            border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s;
            font-size: 14px; white-space: nowrap;
        }
        .btn-update:hover { background: #b80067; transform: scale(1.02); }
        .btn-update:active { transform: scale(0.98); }
        .btn-update:disabled { background: #d1d5db; cursor: not-allowed; }

        /* Loader */
        .loader {
            width: 20px; height: 20px; border: 3px solid #f3f3f3;
            border-top: 3px solid var(--sakura); border-radius: 50%;
            animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Sakurazaka46 Profiles</h1>
        <div class="status-container">
            <div class="dot"></div>
            <div class="last-update" id="timestamp">Mengecek waktu update...</div>
        </div>
    </header>

    <div class="member-grid" id="member-grid">
        </div>
</div>

<div class="footer-action">
    <div class="loader" id="sync-loader"></div>
    <button class="btn-update" id="update-btn" onclick="triggerUpdate()">Update Database</button>
</div>

<script>
    const REPO = "re-saishun/saishunsubs";
    const JSON_PATH = "blogprofil.json";

    // 1. Fungsi Format Waktu (WIB)
    function formatIndoTime(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleString('id-ID', { 
            day: '2-digit', month: 'long', year: 'numeric', 
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            timeZoneName: 'short' 
        });
    }

    // 2. Ambil Data Preview & Waktu Update Terakhir dari GitHub API
    async function loadData() {
        try {
            // Ambil info commit terakhir untuk file blogprofil.json
            const commitRes = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${JSON_PATH}&per_page=1`);
            const commitData = await commitRes.json();
            
            if (commitData.length > 0) {
                const lastDate = commitData[0].commit.committer.date;
                document.getElementById('timestamp').innerText = `Update Terakhir: ${formatIndoTime(lastDate)}`;
            }

            // Ambil data JSON untuk preview card
            const res = await fetch(`${JSON_PATH}?t=${Date.now()}`);
            const data = await res.json();
            const grid = document.getElementById('member-grid');
            grid.innerHTML = "";

            Object.values(data).forEach(m => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${m.img}" onerror="this.src='https://sakurazaka46.com/images/14/placeholder.jpg'" loading="lazy">
                        <div class="card-info">
                            <span class="name-jp">${m.name_jp}</span>
                            <span class="name-en">${m.name_romaji}</span>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error("Gagal load data", e);
            document.getElementById('timestamp').innerText = "Gagal memuat waktu update.";
        }
    }

    // 3. Trigger GitHub Action
    async function triggerUpdate() {
        const token = prompt("Masukkan GitHub Classic Token (ghp_...):");
        if(!token) return;

        const btn = document.getElementById('update-btn');
        const loader = document.getElementById('sync-loader');

        btn.disabled = true;
        loader.style.display = "block";
        btn.innerText = "Mengirim Perintah...";

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/update_member.yml/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token.trim()}`,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                },
                body: JSON.stringify({ ref: "main" })
            });

            if (res.status === 204) {
                alert("✅ Permintaan Diterima! GitHub Action sedang memproses update.\n\nFoto baru akan muncul otomatis dalam 1-2 menit setelah Action selesai.");
            } else if (res.status === 403) {
                alert("❌ Error 403: Token tidak punya izin 'workflow' atau 'repo'.");
            } else {
                alert(`❌ Gagal: ${res.statusText}`);
            }
        } catch (e) {
            alert("Terjadi kesalahan koneksi.");
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
            btn.innerText = "Update Database";
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
